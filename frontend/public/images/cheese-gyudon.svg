<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="shadow"><stop offset="0.7" stop-color="#000" stop-opacity="0.25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="rice" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#8a6a3f"/><stop offset="0.7" stop-color="#6f5230"/><stop offset="1" stop-color="#574023"/>
    </radialGradient>
    <radialGradient id="cheese" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe49c"/><stop offset="0.7" stop-color="#f6c84b"/><stop offset="1" stop-color="#eaa93c"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b23b2a"/><stop offset="1" stop-color="#8c2a1d"/>
    </linearGradient>
    <linearGradient id="bowlrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c94a35"/><stop offset="1" stop-color="#9c3121"/>
    </linearGradient>
  </defs>

  <!-- table -->
  <rect width="800" height="600" fill="#2f2a28"/>
  <g stroke="#1c1817" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M0,80 C200,72 400,88 800,78"/><path d="M0,200 C200,192 400,208 800,198"/>
    <path d="M0,520 C200,512 400,528 800,518"/>
  </g>
  <rect x="0" y="140" width="800" height="2" fill="#1c1817" opacity="0.4"/>
  <rect x="0" y="460" width="800" height="2" fill="#1c1817" opacity="0.4"/>

  <!-- steam -->
  <g stroke="#ffffff" stroke-width="7" fill="none" opacity="0.14" stroke-linecap="round">
    <path d="M345,150 C315,110 375,90 345,45"/>
    <path d="M455,150 C425,110 485,90 455,45"/>
  </g>

  <!-- bowl shadow -->
  <ellipse cx="400" cy="472" rx="252" ry="48" fill="url(#shadow)"/>

  <!-- bowl -->
  <path d="M150,330 a250,70 0 0 0 500,0 l-30,122 a224,62 0 0 1 -440,0 z" fill="url(#bowl)" stroke="#6f2015" stroke-width="2"/>
  <ellipse cx="400" cy="330" rx="250" ry="72" fill="url(#bowlrim)" stroke="#6f2015" stroke-width="2"/>

  <!-- rice / beef base -->
  <ellipse cx="400" cy="334" rx="228" ry="62" fill="url(#rice)"/>
  <!-- beef slices -->
  <g fill="#6a4426" stroke="#4f3119" stroke-width="1.5" opacity="0.95">
    <path d="M250,330 q30,-18 60,-4 q-8,20 -40,22 q-26,-2 -20,-18 z"/>
    <path d="M470,322 q34,-16 64,0 q-10,22 -46,22 q-26,-6 -18,-22 z"/>
    <path d="M330,364 q34,-16 64,0 q-10,22 -46,22 q-26,-6 -18,-22 z"/>
  </g>
  <!-- onion strands -->
  <g stroke="#e8dcc0" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M300,320 C340,312 360,330 330,336"/>
    <path d="M430,360 C470,352 486,368 452,374"/>
  </g>

  <!-- melted cheese pool -->
  <path d="M300,300 q50,-22 110,-8 q50,12 70,34 q14,30 -22,46 q-70,24 -140,6 q-44,-14 -38,-46 q4,-22 20,-32 z"
        fill="url(#cheese)" stroke="#e0a83a" stroke-width="2" opacity="0.96"/>
  <!-- cheese drips -->
  <g fill="#f4cd62">
    <path d="M312,352 q-6,26 6,40 q12,-10 8,-40 z"/>
    <path d="M470,348 q10,24 2,42 q-14,-12 -8,-42 z"/>
  </g>
  <!-- cheese highlight -->
  <ellipse cx="350" cy="312" rx="56" ry="16" fill="#fff0bf" opacity="0.6"/>

  <!-- egg yolk on top -->
  <circle cx="408" cy="330" r="30" fill="#ffffff" opacity="0.35"/>
  <circle cx="408" cy="330" r="22" fill="#f6a93a"/>
  <circle cx="400" cy="322" r="7" fill="#ffd98a" opacity="0.8"/>

  <!-- green onion + pepper -->
  <g fill="#6fae3e">
    <rect x="356" y="300" width="16" height="7" rx="3" transform="rotate(24 364 304)"/>
    <rect x="452" y="338" width="16" height="7" rx="3" transform="rotate(-16 460 342)"/>
    <rect x="330" y="372" width="15" height="7" rx="3" transform="rotate(38 337 375)"/>
  </g>
  <g fill="#2a2320">
    <circle cx="376" cy="356" r="2"/><circle cx="432" cy="312" r="2"/><circle cx="414" cy="372" r="2"/><circle cx="352" cy="334" r="2"/>
  </g>

  <!-- chopsticks -->
  <g transform="rotate(-20 620 300)">
    <rect x="560" y="286" width="230" height="9" rx="4" fill="#7a4b2a"/>
    <rect x="560" y="302" width="230" height="9" rx="4" fill="#8a5631"/>
  </g>
</svg>
