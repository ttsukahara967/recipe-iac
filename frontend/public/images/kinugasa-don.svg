<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="shadow"><stop offset="0.7" stop-color="#000" stop-opacity="0.25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="egg" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffdf7e"/><stop offset="0.65" stop-color="#f5c74f"/><stop offset="1" stop-color="#e0a93a"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a7a"/><stop offset="1" stop-color="#1b3155"/>
    </linearGradient>
    <linearGradient id="bowlrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5e95"/><stop offset="1" stop-color="#24416e"/>
    </linearGradient>
  </defs>

  <!-- table -->
  <rect width="800" height="600" fill="#2f2a28"/>
  <g stroke="#1c1817" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M0,80 C200,72 400,88 800,78"/><path d="M0,200 C200,192 400,208 800,198"/>
    <path d="M0,520 C200,512 400,528 800,518"/>
  </g>
  <rect x="0" y="140" width="800" height="2" fill="#1c1817" opacity="0.4"/>
  <rect x="0" y="460" width="800" height="2" fill="#1c1817" opacity="0.4"/>

  <!-- steam -->
  <g stroke="#ffffff" stroke-width="7" fill="none" opacity="0.14" stroke-linecap="round">
    <path d="M345,150 C315,110 375,90 345,45"/>
    <path d="M455,150 C425,110 485,90 455,45"/>
  </g>

  <!-- bowl shadow -->
  <ellipse cx="400" cy="472" rx="252" ry="48" fill="url(#shadow)"/>

  <!-- bowl -->
  <path d="M150,330 a250,70 0 0 0 500,0 l-30,122 a224,62 0 0 1 -440,0 z" fill="url(#bowl)" stroke="#162946" stroke-width="2"/>
  <ellipse cx="400" cy="330" rx="250" ry="72" fill="url(#bowlrim)" stroke="#162946" stroke-width="2"/>
  <!-- blue-and-white rim pattern -->
  <g fill="#cdd9ec" opacity="0.8">
    <circle cx="190" cy="318" r="5"/><circle cx="250" cy="304" r="5"/><circle cx="330" cy="296" r="5"/>
    <circle cx="470" cy="296" r="5"/><circle cx="550" cy="304" r="5"/><circle cx="610" cy="318" r="5"/>
  </g>

  <!-- egg topping fills the inside -->
  <ellipse cx="400" cy="334" rx="228" ry="62" fill="url(#egg)"/>
  <!-- softly set egg ripples -->
  <g stroke="#f7d774" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M250,330 C320,312 360,344 300,352"/>
    <path d="M460,318 C520,306 560,330 500,342"/>
    <path d="M330,368 C390,356 420,374 370,384"/>
  </g>
  <!-- glossy highlight -->
  <ellipse cx="330" cy="316" rx="60" ry="16" fill="#fff2c4" opacity="0.5"/>

  <!-- abura-age strips (the "cutlet" that is actually fried tofu) -->
  <g stroke="#9a6a2f" stroke-width="1.5">
    <rect x="300" y="300" width="70" height="20" rx="4" fill="#cf9a52" transform="rotate(-10 335 310)"/>
    <rect x="360" y="322" width="76" height="20" rx="4" fill="#c8923f" transform="rotate(7 398 332)"/>
    <rect x="312" y="344" width="66" height="19" rx="4" fill="#d6a460" transform="rotate(4 345 353)"/>
    <rect x="420" y="348" width="70" height="19" rx="4" fill="#c8923f" transform="rotate(-8 455 357)"/>
    <rect x="372" y="372" width="64" height="18" rx="4" fill="#cf9a52" transform="rotate(14 404 381)"/>
  </g>
  <!-- fried-tofu texture specks -->
  <g fill="#8a5a28" opacity="0.6">
    <circle cx="320" cy="309" r="2"/><circle cx="345" cy="313" r="2"/><circle cx="395" cy="332" r="2"/>
    <circle cx="430" cy="357" r="2"/><circle cx="400" cy="380" r="2"/><circle cx="350" cy="352" r="2"/>
  </g>

  <!-- green onion -->
  <g fill="#6fae3e">
    <rect x="356" y="302" width="18" height="8" rx="4" transform="rotate(24 365 306)"/>
    <rect x="432" y="330" width="18" height="8" rx="4" transform="rotate(-16 441 334)"/>
    <rect x="330" y="360" width="16" height="7" rx="3" transform="rotate(40 338 363)"/>
    <rect x="468" y="356" width="16" height="7" rx="3" transform="rotate(8 476 359)"/>
    <rect x="404" y="384" width="17" height="7" rx="3" transform="rotate(-28 412 387)"/>
  </g>

  <!-- chopsticks -->
  <g transform="rotate(-20 620 300)">
    <rect x="560" y="286" width="230" height="9" rx="4" fill="#7a4b2a"/>
    <rect x="560" y="302" width="230" height="9" rx="4" fill="#8a5631"/>
  </g>
</svg>
