<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="shadow"><stop offset="0.7" stop-color="#000" stop-opacity="0.25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="broth" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#d4452a"/><stop offset="0.6" stop-color="#b8331d"/><stop offset="1" stop-color="#8f2414"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f1ec"/><stop offset="1" stop-color="#cfc9bf"/>
    </linearGradient>
    <linearGradient id="bowlrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ddd2"/>
    </linearGradient>
  </defs>

  <!-- table -->
  <rect width="800" height="600" fill="#2f2a28"/>
  <g stroke="#1c1817" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M0,80 C200,72 400,88 800,78"/><path d="M0,200 C200,192 400,208 800,198"/>
    <path d="M0,520 C200,512 400,528 800,518"/>
  </g>
  <rect x="0" y="140" width="800" height="2" fill="#1c1817" opacity="0.4"/>
  <rect x="0" y="460" width="800" height="2" fill="#1c1817" opacity="0.4"/>

  <!-- steam -->
  <g stroke="#ffffff" stroke-width="7" fill="none" opacity="0.14" stroke-linecap="round">
    <path d="M330,150 C300,110 360,90 330,45"/>
    <path d="M470,150 C440,110 500,90 470,45"/>
  </g>

  <!-- bowl shadow -->
  <ellipse cx="400" cy="470" rx="250" ry="48" fill="url(#shadow)"/>

  <!-- bowl -->
  <path d="M150,330 a250,70 0 0 0 500,0 l-28,118 a222,60 0 0 1 -444,0 z" fill="url(#bowl)" stroke="#b7b1a6" stroke-width="2"/>
  <ellipse cx="400" cy="330" rx="250" ry="72" fill="url(#bowlrim)" stroke="#cfc9bf" stroke-width="2"/>
  <ellipse cx="400" cy="332" rx="232" ry="64" fill="url(#broth)"/>

  <!-- noodles peeking at the edge -->
  <g stroke="#f0d98a" stroke-width="5" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M250,318 C300,300 340,318 300,338"/>
    <path d="M520,320 C560,302 585,322 548,340"/>
    <path d="M300,356 C350,344 380,360 345,374"/>
  </g>

  <!-- mapo topping: tofu cubes -->
  <g>
    <rect x="352" y="300" width="42" height="40" rx="5" fill="#fff7e8" stroke="#e8dcc0" stroke-width="2" transform="rotate(-8 373 320)"/>
    <rect x="404" y="312" width="44" height="42" rx="5" fill="#fff3df" stroke="#e8dcc0" stroke-width="2" transform="rotate(6 426 333)"/>
    <rect x="360" y="346" width="40" height="38" rx="5" fill="#fffaf0" stroke="#e8dcc0" stroke-width="2" transform="rotate(4 380 365)"/>
    <rect x="414" y="352" width="40" height="38" rx="5" fill="#fff7e8" stroke="#e8dcc0" stroke-width="2" transform="rotate(-6 434 371)"/>
  </g>

  <!-- ground pork + chili flecks -->
  <g fill="#7a2f17">
    <circle cx="340" cy="332" r="5"/><circle cx="398" cy="300" r="5"/><circle cx="452" cy="334" r="5"/>
    <circle cx="372" cy="392" r="5"/><circle cx="430" cy="392" r="5"/><circle cx="462" cy="366" r="4"/>
    <circle cx="326" cy="360" r="4"/>
  </g>
  <g fill="#e2541f" opacity="0.9">
    <circle cx="358" cy="316" r="3"/><circle cx="440" cy="312" r="3"/><circle cx="470" cy="350" r="3"/>
    <circle cx="350" cy="378" r="3"/><circle cx="412" cy="378" r="3"/>
  </g>

  <!-- chili oil sheen -->
  <ellipse cx="300" cy="360" rx="40" ry="12" fill="#e85a2a" opacity="0.4"/>
  <ellipse cx="500" cy="352" rx="46" ry="12" fill="#e85a2a" opacity="0.35"/>

  <!-- green onion -->
  <g fill="#6fae3e">
    <rect x="384" y="296" width="16" height="7" rx="3" transform="rotate(20 392 299)"/>
    <rect x="430" y="330" width="16" height="7" rx="3" transform="rotate(-15 438 333)"/>
    <rect x="356" y="364" width="15" height="7" rx="3" transform="rotate(35 363 367)"/>
    <rect x="452" y="372" width="15" height="7" rx="3" transform="rotate(10 459 375)"/>
    <rect x="404" y="384" width="15" height="7" rx="3" transform="rotate(-25 411 387)"/>
  </g>

  <!-- spoon -->
  <g transform="rotate(18 640 420)">
    <ellipse cx="640" cy="420" rx="52" ry="30" fill="#e7e2d8" stroke="#c7c0b4" stroke-width="2"/>
    <ellipse cx="640" cy="416" rx="40" ry="20" fill="#cf4026" opacity="0.65"/>
    <rect x="678" y="408" width="120" height="16" rx="8" fill="#e7e2d8" stroke="#c7c0b4" stroke-width="2"/>
  </g>
</svg>
