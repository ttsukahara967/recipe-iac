<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="shadow"><stop offset="0.7" stop-color="#000" stop-opacity="0.25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="broth" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#e5c489"/><stop offset="0.65" stop-color="#d2ab6b"/><stop offset="1" stop-color="#b98f4f"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f1ec"/><stop offset="1" stop-color="#d8d2c6"/>
    </linearGradient>
    <linearGradient id="bowlrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
  </defs>

  <!-- table -->
  <rect width="800" height="600" fill="#2f2a28"/>
  <g stroke="#1c1817" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M0,80 C200,72 400,88 800,78"/><path d="M0,200 C200,192 400,208 800,198"/>
    <path d="M0,520 C200,512 400,528 800,518"/>
  </g>
  <rect x="0" y="140" width="800" height="2" fill="#1c1817" opacity="0.4"/>
  <rect x="0" y="460" width="800" height="2" fill="#1c1817" opacity="0.4"/>

  <!-- red-line rim decoration (Okinawa pottery vibe) -->
  <!-- steam -->
  <g stroke="#ffffff" stroke-width="7" fill="none" opacity="0.14" stroke-linecap="round">
    <path d="M345,150 C315,110 375,90 345,45"/>
    <path d="M455,150 C425,110 485,90 455,45"/>
  </g>

  <!-- bowl shadow -->
  <ellipse cx="400" cy="472" rx="252" ry="48" fill="url(#shadow)"/>

  <!-- bowl -->
  <path d="M150,330 a250,70 0 0 0 500,0 l-30,122 a224,62 0 0 1 -440,0 z" fill="url(#bowl)" stroke="#bdb7ab" stroke-width="2"/>
  <ellipse cx="400" cy="330" rx="250" ry="72" fill="url(#bowlrim)" stroke="#cfc9bf" stroke-width="2"/>
  <!-- red rim band -->
  <path d="M168,322 a232,64 0 0 0 464,0" fill="none" stroke="#c0392b" stroke-width="6" opacity="0.8"/>
  <ellipse cx="400" cy="332" rx="230" ry="62" fill="url(#broth)"/>

  <!-- thick noodles peeking -->
  <g stroke="#f0e2b8" stroke-width="7" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M255,322 C305,304 345,324 302,344"/>
    <path d="M300,356 C350,342 384,360 346,376"/>
    <path d="M520,320 C560,302 585,322 548,340"/>
  </g>

  <!-- san-mai-niku (stewed pork belly) slices, layered fat/lean -->
  <g>
    <g transform="rotate(-8 360 322)">
      <rect x="320" y="302" width="80" height="40" rx="7" fill="#6a4426"/>
      <rect x="320" y="310" width="80" height="7" fill="#e9d8bf"/>
      <rect x="320" y="324" width="80" height="6" fill="#efe0c9"/>
    </g>
    <g transform="rotate(7 440 352)">
      <rect x="402" y="332" width="82" height="40" rx="7" fill="#6a4426"/>
      <rect x="402" y="340" width="82" height="7" fill="#e9d8bf"/>
      <rect x="402" y="354" width="82" height="6" fill="#efe0c9"/>
    </g>
  </g>

  <!-- kamaboko (fish cake with pink swirl) -->
  <g transform="rotate(10 320 372)">
    <rect x="292" y="356" width="56" height="34" rx="9" fill="#fbf6ef" stroke="#e7ddcc" stroke-width="2"/>
    <path d="M300,386 q6,-26 22,-26 q16,0 18,16" fill="none" stroke="#e8788f" stroke-width="5"/>
  </g>

  <!-- beni-shoga (red pickled ginger) -->
  <g fill="#d0392f">
    <rect x="455" y="312" width="22" height="5" rx="2" transform="rotate(30 466 314)"/>
    <rect x="470" y="330" width="22" height="5" rx="2" transform="rotate(-10 481 332)"/>
    <rect x="448" y="346" width="20" height="5" rx="2" transform="rotate(50 458 348)"/>
  </g>

  <!-- green onion -->
  <g fill="#6fae3e">
    <circle cx="372" cy="310" r="4"/><circle cx="420" cy="324" r="4"/><circle cx="398" cy="356" r="4"/>
    <circle cx="352" cy="344" r="4"/><circle cx="448" cy="368" r="4"/><circle cx="386" cy="384" r="4"/>
  </g>

  <!-- chopsticks -->
  <g transform="rotate(-20 620 300)">
    <rect x="560" y="286" width="230" height="9" rx="4" fill="#7a4b2a"/>
    <rect x="560" y="302" width="230" height="9" rx="4" fill="#8a5631"/>
  </g>
</svg>
